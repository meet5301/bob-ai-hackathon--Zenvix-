submission:
  title: "Smart Student Assistant"

  problem_statement: >
    Students struggle to find personalized learning resources and
    receive appropriate guidance for their learning needs.

  solution_summary: >
    We built an AI-powered assistant that provides personalized
    learning guidance and recommendations based on student requirements.

  key_features:
    - "AI-powered question answering"
    - "Personalized recommendations"
    - "Progress tracking"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["Flask", "React"]
    ibm_technologies: ["IBM Bob"]
    databases: ["MongoDB"]
    other: ["GitHub Actions"]

  what_we_are_most_proud_of: >
    We are most proud of creating a practical AI solution that addresses
    a real-world problem through an intuitive user experience.

  known_limitations: >
    Some advanced features may require additional testing and development
    beyond the hackathon timeframe.

